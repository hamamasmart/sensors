name: Deploy to AWS Lambda (SAM)

# Deploys the hamama stack defined in template.yaml with AWS SAM. Everything
# that used to be manual (Function URLs, the scraper schedule, execution roles,
# SERVER_URL wiring) now lives in the template — this workflow just builds and
# ships it.
#
# Required GitHub secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   DATABASE_URL      - postgres connection string for the server
#   AUTH_TOKEN        - shared bearer token (server checks it, scraper sends it)
#   PHYTECH_EMAIL, PHYTECH_PASSWORD

on:
  push:
    branches: [main]
  workflow_dispatch:  # run from the Actions tab without merging to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain with Cargo Lambda
        uses: moonrepo/setup-rust@v1
        with:
          bins: cargo-lambda
          cache-target: release

      - name: Install Zig toolchain
        uses: mlugg/setup-zig@v2

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Ensure SAM artifacts bucket exists
        run: .github/scripts/ensure-sam-bucket.sh

      - name: Build Lambda artifacts
        env:
          SQLX_OFFLINE: "true"
        run: cargo lambda build --release --arm64 -p server -p scraper

      - name: Deploy (sam deploy)
        # Secrets are passed through env vars rather than interpolated into the
        # script, so values with spaces/commas/shell metacharacters don't break
        # parsing or the shell.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          PHYTECH_EMAIL: ${{ secrets.PHYTECH_EMAIL }}
          PHYTECH_PASSWORD: ${{ secrets.PHYTECH_PASSWORD }}
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name hamama \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --s3-bucket "${SAM_BUCKET}" \
            --s3-prefix hamama \
            --no-confirm-changeset \
            --no-disable-rollback \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DatabaseUrl="${DATABASE_URL}" \
              AuthToken="${AUTH_TOKEN}" \
              PhytechEmail="${PHYTECH_EMAIL}" \
              PhytechPassword="${PHYTECH_PASSWORD}"
