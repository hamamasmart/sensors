name: Deploy camera-capture (arm64)

# Cross-compiles the `camera-capture` binary for aarch64 Linux (Raspberry Pi)
# and deploys it directly to the Pi over Tailscale — no GitHub Release is
# produced.
#
# On every merge to `main` that touches `crates/camera-capture/**` (or this
# workflow), and on demand from the Actions tab:
#   1. build the aarch64 release binary (same Zig-backed toolchain as the
#      AWS Lambda builds — cargo-zigbuild pins glibc 2.28 so the binary runs
#      on current Raspberry Pi OS releases),
#   2. generate cameras.toml from secrets + the deployed server's Function
#      URL (server_url from the hamama stack output, auth_token from
#      AUTH_TOKEN, the rest from CAMERAS_CONFIG_TOML),
#   3. join the ephemeral runner to the tailnet with a Tailscale auth key,
#   4. scp the binary + systemd unit + generated config to the Pi, install,
#      and restart the service.
#
# The Pi is reached at its Tailscale IP. CI authenticates with a dedicated
# deploy SSH key (PI_SSH_KEY) installed in the pi user's authorized_keys,
# restricted to the 100.64.0.0/10 (Tailscale) source range. The pi user has
# NOPASSWD sudo, so the install/restart runs passwordless. The live config is
# generated by the workflow — the camera definitions live in the
# CAMERAS_CONFIG_TOML secret, not in the repo.

on:
  push:
    branches: [main]
    paths:
      - crates/camera-capture/**
      - .github/workflows/deploy-camera-capture.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Don't run automatically for dependabot/renovate bots on main pushes —
    # those should be vetted first. Manual dispatch still works.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain with aarch64 target
        uses: moonrepo/setup-rust@v1
        with:
          targets: aarch64-unknown-linux-gnu
          cache-target: release

      - name: Install Zig toolchain
        uses: mlugg/setup-zig@v2
        # cargo-zigbuild pins Zig via its own requirement; mlugg/action installs
        # a recent stable Zig that satisfies it.

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build aarch64 release binary
        run: cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.28 -p camera-capture

      - name: Configure AWS Credentials
        # Needed to read the deployed server Lambda's Function URL from the
        # hamama CloudFormation stack output. Same credentials as deploy.yml.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate cameras.toml
        # Assemble the live config from three sources, none of which lives in
        # the repo:
        #   server_url  — the deployed server Lambda Function URL (stack output)
        #   auth_token  — the AUTH_TOKEN secret (shared with the scraper/server)
        #   the rest     — the CAMERAS_CONFIG_TOML secret (interval + camera defs)
        # Top-level keys must precede the [[cameras]] array-of-tables in TOML, so
        # the two injected keys are prepended. Secrets are passed via env, not
        # interpolated, so values with shell metacharacters don't break parsing.
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CAMERAS_CONFIG_TOML: ${{ secrets.CAMERAS_CONFIG_TOML }}
        run: |
          set -euo pipefail
          server_url="$(aws cloudformation describe-stacks --stack-name hamama \
            --query "Stacks[0].Outputs[?OutputKey=='ServerFunctionUrl'].OutputValue" \
            --output text)"
          # The uploader appends "/cameras/images", so trim the trailing slash
          # the Function URL ships with.
          server_url="${server_url%/}"
          {
            printf 'server_url = "%s"\n' "$server_url"
            printf 'auth_token = "%s"\n' "$AUTH_TOKEN"
            printf '\n'
            printf '%s\n' "$CAMERAS_CONFIG_TOML"
          } > cameras.toml
          # Sanity: refuse to deploy a config missing the injected keys.
          grep -q '^server_url = ' cameras.toml
          grep -q '^auth_token = ' cameras.toml
          echo "--- generated cameras.toml (secrets redacted) ---"
          sed -E 's/(auth_token = ").*"/\1***"/' cameras.toml

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # Fail fast if the runner can't reach the Pi before we try to deploy.
          ping: 100.64.132.105

      - name: Stage deploy SSH key
        run: |
          install -d -m700 ~/.ssh
          printf '%s\n' "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ephemeral runner — accept the Pi's host key on first connect.
          printf '%s\n' 'Host 100.64.132.105' \
            '  StrictHostKeyChecking accept-new' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to Pi
        run: |
          set -euo pipefail
          PI=pi@100.64.132.105
          BIN=target/aarch64-unknown-linux-gnu/release/camera-capture
          UNIT=crates/camera-capture/camera-capture.service
          CFG=cameras.toml

          scp -o StrictHostKeyChecking=accept-new "$BIN" "$UNIT" "$CFG" "$PI":/tmp/

          # Install binary + unit + generated config, reload, restart.
          # is-active exits non-zero if the service didn't come up → step fails.
          ssh -o StrictHostKeyChecking=accept-new "$PI" 'sudo -n bash -s' <<'REMOTE'
            set -e
            install -m755  /tmp/camera-capture          /opt/camera-capture/camera-capture
            install -m644  /tmp/camera-capture.service  /etc/systemd/system/camera-capture.service
            install -m600  /tmp/cameras.toml            /opt/camera-capture/cameras.toml
            systemctl daemon-reload
            systemctl restart camera-capture
            systemctl is-active camera-capture
          REMOTE

          echo "--- post-deploy journal (last 8 lines) ---"
          ssh -o StrictHostKeyChecking=accept-new "$PI" 'journalctl -u camera-capture -n 8 --no-pager'
