name: Deploy camera-capture (arm64)

# Builds the `camera-capture` binary for aarch64 Linux (Raspberry Pi) and
# deploys it directly to the Pi over Tailscale — no GitHub Release is produced.
#
# On every merge to `main` that touches `crates/camera-capture/**` (or this
# workflow), and on demand from the Actions tab:
#   1. build the aarch64 release binary natively on a GitHub-hosted ARM runner,
#   2. generate cameras.toml from secrets + the deployed server's Lightsail
#      HTTPS URL (server_url from the hamama stack `ServerUrl` output,
#      auth_token from AUTH_TOKEN, the rest from CAMERAS_CONFIG_TOML),
#   3. join the ephemeral runner to the tailnet with a Tailscale auth key,
#   4. scp the binary + systemd unit + generated config to the Pi, install,
#      and restart the service.
#
# We build on a native aarch64 runner (ubuntu-24.04-arm) rather than cross-
# compiling from x86. camera-capture depends on ffmpeg-next with the `build`
# feature, which builds ffmpeg from source via ffmpeg-sys-next; its configure
# script derives a `--cross-prefix` from the C compiler's filename, which is
# incompatible with cargo-zigbuild's PID-suffixed wrapper names (ffmpeg ends
# up invoking a `...-gcc` binary that doesn't exist). A native ARM build
# sidesteps the entire cross-toolchain. The Pi runs Debian 13 (glibc 2.40);
# ubuntu-24.04-arm's glibc 2.39 is older, so the binary runs there fine
# (newer glibc runs binaries built against an older one).
#
# The Pi is reached at its Tailscale IP. CI authenticates with a dedicated
# deploy SSH key (PI_SSH_KEY) installed in the pi user's authorized_keys,
# restricted to the 100.64.0.0/10 (Tailscale) source range. The pi user has
# NOPASSWD sudo, so the install/restart runs passwordless. The live config is
# generated by the workflow — the camera definitions live in the
# CAMERAS_CONFIG_TOML secret, not in the repo.

on:
  push:
    branches: [main]
    paths:
      - crates/camera-capture/**
      - .github/workflows/deploy-camera-capture.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    # Don't run automatically for dependabot/renovate bots on main pushes —
    # those should be vetted first. Manual dispatch still works.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # ffmpeg-next builds ffmpeg from source (the `build` feature); its
      # configure step probes for nasm even on a native aarch64 build.
      - name: Install ffmpeg build deps
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@v1
        with:
          cache-target: release

      - name: Build aarch64 release binary
        run: cargo build --release -p camera-capture

      - name: Configure AWS Credentials
        # Needed to read the deployed server Lambda's Function URL from the
        # hamama CloudFormation stack output. Same credentials as deploy.yml.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Generate cameras.toml
        # Assembles the live config from three sources, none of which lives in
        # the repo: server_url (the deployed server's Lightsail HTTPS URL, read
        # from the hamama stack `ServerUrl` output), auth_token (AUTH_TOKEN
        # secret), and the rest (CAMERAS_CONFIG_TOML secret). See the script
        # header for details.
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          CAMERAS_CONFIG_TOML: ${{ secrets.CAMERAS_CONFIG_TOML }}
        run: .github/scripts/generate-cameras-toml.sh

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # Fail fast if the runner can't reach the Pi before we try to deploy.
          ping: ${{ vars.PI_HOST }}

      - name: Stage deploy SSH key
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_HOST: ${{ vars.PI_HOST }}
        run: .github/scripts/stage-deploy-ssh-key.sh

      - name: Deploy to Pi
        # scps the binary + systemd unit + generated cameras.toml to the Pi,
        # installs them, reloads systemd, and restarts the service. Fails the
        # step if the service doesn't come up. See the script header.
        env:
          PI_HOST: ${{ vars.PI_HOST }}
        run: .github/scripts/deploy-camera-capture-to-pi.sh
