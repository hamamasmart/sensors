# ESP32-S3 Sensor Configurator Configuration
#
# Programs a single RS485 Modbus-RTU sensor's slave address and baud rate from the `input`
# parameters (the sensor's current settings) to the `output` parameters (the desired settings).
# The firmware is flashed once per configuration job; edit this file and rebuild.

# Sensor model to configure. Selects the holding-register map used for address/baud-rate.
#   "SN-300AL-GH-N01"     — N01 RS485 family (address 0x07D0, baud 0x07D1, slave 1..=254)
#   "LightIntensityRs485" — RS485 light sensor (address 0x0100, baud 0x0101, slave 1..=251)
sensor_type = "SN-300AL-GH-N01"

# Current (input) communication parameters the sensor is using right now.
# The configurator talks to the sensor at these settings to issue the write commands.
[input]
slave_id = 1
baud_rate = 4800

# Desired (output) communication parameters to program into the sensor.
[output]
slave_id = 2
baud_rate = 9600

[modbus]
timeout_ms = 1000
turnaround_delay_ms = 5
