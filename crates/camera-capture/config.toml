# Example configuration for the camera-capture loop.

# Base URL of the cloud `server` (the crate that owns POST /cameras/images).
# The `/cameras/images` path is appended automatically.
server_url = "https://<your-server>.lambda-url.us-east-1.on.aws"
auth_token = "shared-secret-bearer-token"

# Global site location, shared by every camera that sets `daylight_only`.
# Decimal degrees. Required only when at least one camera opts into daylight
# gating; ignored otherwise.
latitude = 32.0853   # Tel Aviv, e.g.
longitude = 34.7818

# Vision-LLM prompts, defined once by `prompt_id` and referenced from any
# location via `prompt_ids`. Each becomes a derived sensor
# `{camera_id}_{prompt_id}` under the `image-analysis` provider on the server.
# `prompt_id` must be unique across this table. Omit the whole `[[prompts]]`
# section (or leave a location's `prompt_ids` empty) to store images without
# analysis.
[[prompts]]
prompt_id = "green-cover"
prompt_text = "What percentage of the frame is green canopy? Reply with a single number."
model = "google/gemini-2.5-flash" # OpenRouter model slug
measurement_unit = "%"            # optional
response_type = "numeric"        # "numeric" (default) or "text"

# Each camera is a PTZ device on the LAN, reached over plain HTTP, and runs on
# its own cadence with its own daylight window.
[[cameras]]
uri = "http://192.168.0.226:8080" # device host root
username = "admin"
password = "admin"
interval_secs = 300               # seconds between captures of this camera
daylight_only = true              # skip ticks outside sunrise→sunset
daylight_margin_mins = 0          # trim [sunrise+margin, sunset-margin] edges
fix_time = true                   # set true if the camera's clock is skewed
settle_secs = 10.0                # wait after a PTZ move before snapshotting
  [[cameras.locations]]
  camera_id = "yard-north"
  pan = 0.0
  tilt = 0.0
  zoom = 0.5
  prompt_ids = ["green-cover"]    # prompts to run on this location's images

