[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
api-types = { workspace = true }
embassy-executor = { version = "0.10.0" }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "dns", "medium-ethernet"] }
embassy-sync = "0.7.2"
embassy-time = "0.5.1"
embedded-io-async = "0.6.1"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-hal = { version = "1.0.0-rc.0", features = ["esp32s3", "unstable"] }
esp-hal-embassy = { version = "0.9.1", features = ["esp32s3"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-wifi = { version = "0.15.1", default-features = false, features = ["esp32s3", "wifi", "esp-alloc", "log-04"] }
log = "0.4"
reqwless = { version = "0.14.0", features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
static_cell = "2.1.1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
