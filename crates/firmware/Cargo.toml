[package]
name = "firmware"
version = "0.1.0"
edition = "2024"
build = "build.rs"

# serde & toml are [build-dependencies] consumed by build.rs (config.toml codegen).
# cargo-machete does not scan build.rs, so it false-positives on them.
[package.metadata.cargo-machete]
ignored = ["serde", "toml"]

[dependencies]
api-types = { workspace = true, default-features = false }
async-modbus = { version = "0.7", default-features = false, features = ["embedded-io"] }
embassy-executor = { version = "0.10.0" }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "dns", "medium-ethernet"] }
embassy-sync = "0.8"
embassy-time = "0.5.1"
embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"
esp-alloc = { git = "https://github.com/esp-rs/esp-hal" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", features = ["esp32s3"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", features = ["esp32s3", "unstable"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", features = ["esp32s3", "wifi", "unstable", "esp-alloc", "log-04"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", features = ["esp32s3", "log-04"] }
log = "0.4"
reqwless = { version = "0.14", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sntpc = { version = "0.11", default-features = false, features = ["log"] }
sntpc-net-embassy = { version = "0.11", default-features = false }
sntpc-time-embassy = "0.6"
static_cell = "2.1.1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
uuid = { version = "1", default-features = false, features = ["serde"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"

