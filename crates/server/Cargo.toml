[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
api-types = { workspace = true }
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
rust-s3 = { version = "0.37", default-features = false, features = ["tokio-rustls-tls", "fail-on-err"] }
sqlx = { version = "0.9", features = ["postgres", "migrate", "runtime-tokio", "tls-rustls-ring", "chrono", "uuid"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }
