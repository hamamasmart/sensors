[env]
# Server crate: sqlx compile-time queries validate against this DB on local builds.
DATABASE_URL="postgres://postgres:postgres@localhost:5432/postgres"
# Use the committed .sqlx offline cache instead of a live DB connection when
# building — required when the local Postgres isn't running (e.g. CI, Lambda builds).
SQLX_OFFLINE="true"
# Scraper crate: where the scraper pushes data locally (the server's dual-mode addr).
SERVER_URL="http://localhost:8080"
