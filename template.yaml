# AWS SAM template for the hamama stack.
#
# Defines the entire Lambda deployment that used to be done with manual steps:
#   - server  : HTTP function (lambda_http) fronted by a Lambda Function URL
#               (AuthType NONE). Owns the DB connection and runs migrations.
#   - scraper  : event-driven function (lambda_runtime) triggered on a schedule.
#
# Wiring that was previously manual is now expressed in-template:
#   - the server's Function URL (was `aws lambda create-function-url-config`),
#   - the EventBridge schedule that triggers the scraper (was a hand-made cron),
#   - the execution roles for both functions,
#   - SERVER_URL, taken straight from the server's Function URL via !GetAtt so
#     nothing has to be copied into a repo variable by hand.
#
# Note on auth: the Function URL is AuthType NONE (public), but every server
# route is guarded by a shared bearer token (AUTH_TOKEN) that the scraper also
# sends, so the endpoint is never actually unauthenticated at the app layer.

Transform: AWS::Serverless-2016-10-31

Parameters:
  DatabaseUrl:
    Type: String
    Description: Postgres connection string used by the server Lambda.
    NoEcho: true
  AuthToken:
    Type: String
    Description: Shared bearer token the scraper presents to the server.
    NoEcho: true
  PhytechEmail:
    Type: String
    Description: Phytech account email used by the scraper.
  PhytechPassword:
    Type: String
    Description: Phytech account password used by the scraper.
    NoEcho: true
  OpenRouterApiKey:
    Type: String
    Description: Bearer token for OpenRouter (Gemini access) used by the analyzer.
    NoEcho: true

Resources:
  ServerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: server
      CodeUri: target/lambda/server
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          AUTH_TOKEN: !Ref AuthToken
          # Name of the analyzer function the server async-invokes per analysis
          # shard (one per camera) from POST /cameras/analyze.
          ANALYZER_FUNCTION_NAME: !Ref AnalyzerFunction
      Policies:
        # The bucket name is hardcoded in the server (S3_BUCKET_NAME). The role
        # needs CreateBucket so the server can create it on first run, plus
        # PutObject to stream camera images into it.
        - Statement:
            - Effect: Allow
              Action:
                - s3:CreateBucket
                - s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::phytech-camera-images"
                - !Sub "arn:aws:s3:::phytech-camera-images/*"
        # Async-invoke one analyzer Lambda per analysis shard.
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt AnalyzerFunction.Arn
      FunctionUrlConfig:
        AuthType: NONE

  AnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: analyzer
      CodeUri: target/lambda/analyzer
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      # Per-shard cap (one camera). Total job time is unbounded because shards
      # run independently — the 15-min limit applies per shard, not per job.
      MemorySize: 1024
      Timeout: 900
      Environment:
        Variables:
          SERVER_URL: !GetAtt ServerFunctionUrl.FunctionUrl
          AUTH_TOKEN: !Ref AuthToken
          OPENROUTER_API_KEY: !Ref OpenRouterApiKey
          OPENROUTER_MODEL: google/gemini-2.5-flash-lite
          S3_BUCKET: phytech-camera-images
          BATCH_SIZE: "8"
          MAX_CONCURRENT_BATCHES: "3"
          MAX_IMAGES_PER_SHARD: "1000"
      Policies:
        # Read-only access to the camera image bucket — the analyzer only lists
        # and fetches images; it never writes to S3 and never touches Bedrock
        # (OpenRouter is plain outbound HTTPS).
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::phytech-camera-images/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub "arn:aws:s3:::phytech-camera-images"

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: scraper
      CodeUri: target/lambda/scraper
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      Environment:
        Variables:
          SERVER_URL: !GetAtt ServerFunctionUrl.FunctionUrl
          AUTH_TOKEN: !Ref AuthToken
          PHYTECH_EMAIL: !Ref PhytechEmail
          PHYTECH_PASSWORD: !Ref PhytechPassword
      Events:
        ScrapeSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: phytech-scraper-schedule
            Enabled: true

Outputs:
  ServerFunctionUrl:
    Description: HTTPS endpoint of the server Lambda (called by the scraper).
    Value: !GetAtt ServerFunctionUrl.FunctionUrl
